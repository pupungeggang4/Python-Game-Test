name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_apk:
    name: Build APK via Buildozer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Buildozer 안정 구동을 위해 3.11 권장

      # Buildozer 구동에 필요한 기본 리눅스 패키지들 사전 설치
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache git libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      # 🚨 백그라운드에서 동의창 대기로 멈추는 것을 방지하기 위해 라이선스를 미리 강제 승인합니다.
      - name: Pre-accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # buildozer가 자동으로 세팅하기 전에 안드로이드 라이선스 수동 우회 설정 가능

      # 실시간 로그(-v)를 켜서 깃허브 액션 콘솔창에서 컴파일 과정을 실시간 모니터링합니다.
      - name: Build with Buildozer
        run: buildozer -v android debug

      # 빌드가 끝나면 bin/ 폴더에 생성된 .apk 파일을 업로드합니다.
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: bin/*.apk

